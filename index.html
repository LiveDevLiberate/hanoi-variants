<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>汉诺塔 — 众神的三角谜团</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <main id="main">
      <header id="page-header">
        <div id="header-inner">
          <svg id="hanoi-logo" viewBox="0 0 120 90" aria-hidden="true">
            <line x1="20" y1="75" x2="20" y2="15" stroke="#ffffff" stroke-width="3"/>
            <line x1="60" y1="75" x2="60" y2="15" stroke="#ffffff" stroke-width="3"/>
            <line x1="100" y1="75" x2="100" y2="15" stroke="#ffffff" stroke-width="3"/>
            <line x1="5" y1="75" x2="115" y2="75" stroke="#ffffff" stroke-width="3"/>
            <rect x="8" y="62" width="24" height="6" rx="1" fill="#ffd700"/>
            <rect x="48" y="66" width="24" height="6" rx="1" fill="#ffd700"/>
            <rect x="51" y="54" width="18" height="6" rx="1" fill="#ffd700"/>
            <rect x="90" y="70" width="20" height="6" rx="1" fill="#ffd700"/>
            <rect x="92" y="60" width="16" height="6" rx="1" fill="#ffd700"/>
            <rect x="94" y="50" width="12" height="6" rx="1" fill="#ffd700"/>
          </svg>
          <div id="header-text">
            <h1>汉诺塔 — 众神的三角谜团</h1>
            <p>七种汉诺塔变体的状态切换图。每种变体可调参数、显示标签与最短路径。</p>
          </div>
        </div>
      </header>
      <div id="variants"></div>
      <section id="papers"></section>
    </main>
  </div>
  <script src="lib/d3.v7.min.js"></script>
  <script src="js/core.js"></script>
  <script src="js/variants.js"></script>
  <script src="js/render.js"></script>
  <script src="js/app.js"></script>
  <script>document.addEventListener('DOMContentLoaded', function(){ HanoiApp.init(); });</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>汉诺塔 — 众神的三角谜团</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cn-font.claude-code-best.win/packages/moon-stars-kai/dist/MoonStarsKaiHW-Bold/result.css">
  <link rel="stylesheet" href="https://cn-font.claude-code-best.win/packages/ysbzt/dist/%E5%B3%84%E5%B1%B1%E7%A2%91%E7%AF%86%E4%BD%93/result.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
</head>
<body>
  <div id="app">
    <main id="main">
      <header id="page-header">
        <div id="header-inner">
          <svg id="hanoi-logo" viewBox="0 0 120 90" aria-hidden="true">
            <defs>
              <linearGradient id="gold-metal" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#cfac62"/>
                <stop offset="30%" stop-color="#ffdf73"/>
                <stop offset="50%" stop-color="#e5b84b"/>
                <stop offset="75%" stop-color="#996515"/>
                <stop offset="100%" stop-color="#eccb76"/>
              </linearGradient>
            </defs>
            <line x1="20" y1="75" x2="20" y2="15" stroke="#ffffff" stroke-width="3"/>
            <line x1="60" y1="75" x2="60" y2="15" stroke="#ffffff" stroke-width="3"/>
            <line x1="100" y1="75" x2="100" y2="15" stroke="#ffffff" stroke-width="3"/>
            <line x1="5" y1="75" x2="115" y2="75" stroke="#ffffff" stroke-width="3"/>
            <rect x="8" y="62" width="24" height="6" rx="1" fill="url(#gold-metal)"/>
            <rect x="48" y="66" width="24" height="6" rx="1" fill="url(#gold-metal)"/>
            <rect x="51" y="54" width="18" height="6" rx="1" fill="url(#gold-metal)"/>
            <rect x="90" y="70" width="20" height="6" rx="1" fill="url(#gold-metal)"/>
            <rect x="92" y="60" width="16" height="6" rx="1" fill="url(#gold-metal)"/>
            <rect x="94" y="50" width="12" height="6" rx="1" fill="url(#gold-metal)"/>
          </svg>
          <div id="header-text">
            <h1 id="hanoi-title">汉诺塔</h1>
            <p class="subtitle" id="hanoi-sub">众神的三角谜团</p>
          </div>
          <div id="lang-switch">
            <button id="lang-btn" type="button" aria-label="切换语言">EN</button>
            <span id="lang-name">中文</span>
          </div>
        </div>
      </header>
      <nav id="section-nav" aria-label="章节导航"></nav>
      <div id="variants"></div>
      <section id="papers"></section>
    </main>
  </div>
  <button id="back-top" type="button" aria-label="回到顶部" title="回到顶部">
    <svg viewBox="0 0 32 32" aria-hidden="true">
      <defs>
        <linearGradient id="gold-edge" x1="0" y1="1" x2="0" y2="0">
          <stop offset="0%" stop-color="#996515"/>
          <stop offset="50%" stop-color="#e5b84b"/>
          <stop offset="100%" stop-color="#ffdf73"/>
        </linearGradient>
      </defs>
      <polygon points="16,3 29,29 3,29" fill="none" stroke="url(#gold-edge)" stroke-width="1.4"/>
      <polygon points="16,11 22.5,24 9.5,24" fill="none" stroke="url(#gold-edge)" stroke-width="1.1"/>
      <polygon points="16,18.5 19.1,24 12.9,24" fill="none" stroke="url(#gold-edge)" stroke-width="0.9"/>
    </svg>
  </button>
  <script src="lib/d3.v7.min.js"></script>
  <script src="js/core.js"></script>
  <script src="js/variants.js"></script>
  <script src="js/render.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script src="js/app.js"></script>
  <script>document.addEventListener('DOMContentLoaded', function(){ HanoiApp.init(); });</script>
</body>
</html>
